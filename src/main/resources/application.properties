spring.application.name=mofawid

server.port=${PORT:8080}

spring.datasource.url=${DATA_SOURCE_URL}
spring.datasource.username=${DATA_SOURCE_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Pièces jointes : taille maximale des fichiers et de la requête multipart.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

spring.ai.model.chat=${CHAT_MODEL}
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${CHAT_MODEL_VERSION}
spring.ai.google.genai.chat.temperature=0.2

tracking.secret=${TRACKING_SECRET}

jwt.secret=${JWT_SECRET}
jwt.expiration=864000


r2.account-id=${R2_ACCOUNT_ID}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket=${R2_BUCKET}
