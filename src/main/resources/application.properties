spring.application.name=mofawid


spring.datasource.url=${DATA_SOURCE_URL}
spring.datasource.username=${DATA_SOURCE_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.ai.model.chat=${CHAT_MODEL:google-genai}
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${CHAT_MODEL_VERSION}
spring.ai.google.genai.chat.temperature=0.2


tracking.secret=${TRACKING_SECRET}


jwt.secret=${JWT_SECRET}
jwt.expiration=86400000