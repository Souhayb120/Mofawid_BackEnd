spring.application.name=mofawid

# Confort local : charger le fichier .env racine (jamais commité, voir .gitignore).
# Les variables d'environnement réelles (Render) ont toujours la priorité
# sur ce fichier, aucun secret n'est requis ici.
spring.config.import=optional:file:.env[.properties]

# Render fournit PORT ; en local on reste sur 8080.
server.port=${PORT:8080}

# Base de données : variables d'environnement en production, MySQL local en secours.
spring.datasource.url=${DATA_SOURCE_URL:jdbc:mysql://localhost:3307/mofawid_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DATA_SOURCE_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Génération IA (Google Gemini via Spring AI).
# GEMINI_API_KEY et JWT_SECRET sont obligatoires (fournis par le .env local
# ou par les variables d'environnement en production) : l'application refuse
# de démarrer sans eux plutôt que de tourner avec une configuration bancale.
spring.ai.model.chat=${CHAT_MODEL:google-genai}
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${CHAT_MODEL_VERSION:gemini-2.5-flash}
spring.ai.google.genai.chat.temperature=0.2

tracking.secret=${TRACKING_SECRET}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
