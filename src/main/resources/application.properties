spring.application.name=mofawid


spring.datasource.url=jdbc:mysql://localhost:3307/mufawid_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.ai.model.chat=${CHAT_MODEL}
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${CHAT_MODEL_VERSION}
spring.ai.google.genai.chat.temperature=0.2


tracking.secret=${TRACKING_SECRET}


jwt.secret=my-super-secret-key-for-mofawid-application-2026
jwt.expiration=86400000